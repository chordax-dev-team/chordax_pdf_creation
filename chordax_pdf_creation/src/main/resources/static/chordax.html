<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Chordax PDF Generator</title>
    <style>
        body {
          font-family: sans-serif;
          padding: 2rem;
          background: #f4f4f4;
        }
        .container {
          background: white;
          padding: 2rem;
          border-radius: 8px;
          max-width: 500px;
          margin: auto;
          box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .tabs {
          display: flex;
          margin-bottom: 1rem;
        }
        .tab {
          flex: 1;
          padding: 0.75rem;
          text-align: center;
          cursor: pointer;
          background: #ddd;
          border-radius: 8px 8px 0 0;
        }
        .tab.active {
          background: white;
          font-weight: bold;
          border-bottom: 2px solid #f4f4f4;
        }
        .tab-content {
          display: none;
        }
        .tab-content.active {
          display: block;
        }
        select, button, textarea {
          width: 100%;
          padding: 0.75rem;
          margin-top: 1rem;
          font-size: 1rem;
        }
        #textAreaWrapper{
          width: 100%;
          padding-right: 2rem;
        }
        textarea {
          width: calc(100% - 25px);
          height: 150px;
          resize: vertical;
          font-size: .7rem;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="./img/chordax.png" width="200"/>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('getSongs')">GET SONG</div>
        <div class="tab" onclick="switchTab('postJson')">ENTER SONG</div>
    </div>

    <div id="getSongs" class="tab-content active">
        <h2>CREATE SONG PDF</h2>
        <label for="songId">SELECT SONG:</label>
        <select id="songId"></select>
        <button onclick="createPDF()">CREATE PDF</button>
    </div>

    <div id="postJson" class="tab-content">
        <h2>CREATE SONG PDF</h2>
        <label for="jsonInput">ENTER SONG AS JSON:</label>
        <div id="textAreaWrapper">
      <textarea id="jsonInput" placeholder='{"title":"My Song","data":"..."}' >{
  "title": "Jestem dzieckiem Twym",
  "composer": "Jonathan David Helser, Melissa Helser",
  "author": "Bethel Music",
  "lines": [
    {
      "lineType": "VERSE",
      "lyrics": "Ty przynosisz mi zwycięstwa pieśń,",
      "tones": [
        { "chord": "D", "position": 0 },
        { "chord": "H", "position": 60 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Ty dotykasz słowem Swym.",
      "tones": [
        { "chord": "G", "position": 30 },
        { "chord": "A", "position": 70 },
        { "chord": "D", "position": 150 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Dajesz wolność mi z sideł wokół mnie,",
      "tones": [
        { "chord": "D", "position": 45 },
        { "chord": "H", "position": 155 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Więc znika każdy lęk.",
      "tones": [
        { "chord": "B", "position": 30 },
        { "chord": "E", "position": 60 },
        { "chord": "H", "position": 90 }
      ]
    },
    {
      "lineType": "CHORUS",
      "lyrics": "Wiem, nie muszę się więcej bać, bo jestem dzieckiem Twym.",
      "tones": [
        { "chord": "G", "position": 0 },
        { "chord": "A", "position": 60 },
        { "chord": "D", "position": 120 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Ty wybrałeś mnie u początku dni,",
      "tones": [
        { "chord": "H", "position": 0 },
        { "chord": "A", "position": 60 },
        { "chord": "D", "position": 120 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Wyszeptałeś imię me.",
      "tones": [
        { "chord": "H", "position": 0 },
        { "chord": "A", "position": 60 },
        { "chord": "D", "position": 120 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Jestem dzieckiem Twym, pokochałeś mnie,",
      "tones": [
        { "chord": "H", "position": 0 },
        { "chord": "A", "position": 60 },
        { "chord": "D", "position": 120 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Me życie w Twojej krwi.",
      "tones": [
        { "chord": "H", "position": 0 },

      ]
    },
    {
      "lineType": "BRIDGE",
      "lyrics": "Idąc za Tobą mogę przejść przez morze,",
      "tones": [

        { "chord": "D", "position": 120 }
      ]
    },
    {
      "lineType": "BRIDGE",
      "lyrics": "W miłości tonie cały strach.",
      "tones": [
        { "chord": "H", "position": 0 },
        { "chord": "A", "position": 60 },
        { "chord": "D", "position": 120 }
      ]
    },
    {
      "lineType": "BRIDGE",
      "lyrics": "Wyzwalasz mnie i mogę wyznać, że",
      "tones": [
        { "chord": "H", "position": 0 },
        { "chord": "A", "position": 60 },
        { "chord": "D", "position": 120 }
      ]
    },
    {
      "lineType": "BRIDGE",
      "lyrics": "Ja jestem dzieckiem Twym.",
      "tones": [
        { "chord": "H", "position": 0 },
        { "chord": "A", "position": 60 },
        { "chord": "D", "position": 120 },
        { "chord": "G", "position": 180 }
      ]
    }
  ]
}
</textarea>
        </div>
        <button onclick="postJson()">CREATE PDF</button>
    </div>
</div>

<script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.querySelector(`.tab[onclick*="${tabId}"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    async function createPDF() {
      const songId = document.getElementById("songId").value;
      try {
        const response = await fetch(`http://localhost:8081/api/v1/pdfs/1/${songId}`);
        if (!response.ok) throw new Error("Failed to fetch PDF");
        const pdfDto = await response.json();
        if (!pdfDto.data || !pdfDto.title) throw new Error("Invalid PDF data received");

        const byteCharacters = atob(pdfDto.data);
        const byteNumbers = Array.from(byteCharacters, c => c.charCodeAt(0));
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: "application/pdf" });

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${pdfDto.title}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (error) {
        alert("Error generating PDF: " + error.message);
      }
    }

    async function fetchTitles() {
      const songSelection = document.getElementById("songId");
      try {
        const response = await fetch("http://localhost:8080/api/v1/titles/1");
        if (!response.ok) throw new Error("Problem with finding titles");
        const titles = await response.json();
        if (!Array.isArray(titles) || titles.length === 0) throw new Error("List of songs is empty");

        titles.forEach((title, index) => {
          const option = document.createElement("option");
          option.value = title.songId;
          option.textContent = title.songTitle;
          songSelection.appendChild(option);
        });
      } catch (error) {
        console.error("Error loading song titles:", error.message);
      }
    }

    async function postJson() {
      const jsonInput = document.getElementById("jsonInput").value;
      try {
        const payload = JSON.parse(jsonInput);
        const response = await fetch("http://localhost:8081/api/v1/pdfs/1", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
if (!response.ok) throw new Error("Failed to fetch PDF");
        const pdfDto = await response.json();
        if (!pdfDto.data || !pdfDto.title) throw new Error("Invalid PDF data received");

        const byteCharacters = atob(pdfDto.data);
        const byteNumbers = Array.from(byteCharacters, c => c.charCodeAt(0));
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: "application/pdf" });

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${pdfDto.title}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (error) {
        alert("Error generating PDF: " + error.message);
      }
    }

    window.onload = fetchTitles;
</script>
</body>
</html>
