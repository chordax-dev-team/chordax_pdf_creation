<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chordax PDF Generator</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f4f4f4;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .tabs {
      display: flex;
      margin-bottom: 1rem;
    }
    .tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      background: #ddd;
      border-radius: 8px 8px 0 0;
    }
    .tab.active {
      background: white;
      font-weight: bold;
      border-bottom: 2px solid #f4f4f4;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    select, button, textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 1rem;
    }
    #textAreaWrapper {
      width: 100%;
      padding-right: 2rem;
    }
    textarea {
      width: calc(100% - 25px);
      height: 150px;
      resize: vertical;
      font-size: .7rem;
    }
    .button-group {
      display: flex;
      gap: 1rem;
    }
  </style>
</head>
<body>
<div class="container">
  <img src="./img/chordax.png" width="200" />
  <div class="tabs">
    <div class="tab active" onclick="switchTab('getSongs')">GET SONG</div>
    <div class="tab" onclick="switchTab('postJson')">ENTER SONG</div>
  </div>

  <div id="getSongs" class="tab-content active">
    <h2>CREATE SONG PDF</h2>
    <label for="songId">SELECT SONG:</label>
    <select id="songId"></select>
    <div class="button-group">
      <button onclick="createPDF()">CREATE PDF</button>
      <button onclick="previewPDF()">PREVIEW PDF</button>
    </div>
  </div>

  <div id="postJson" class="tab-content">
    <h2>CREATE SONG PDF</h2>
    <label for="jsonInput">ENTER SONG AS JSON:</label>
    <div id="textAreaWrapper">
        <textarea id="jsonInput" placeholder='{"title":"My Song","composer":"...","author":"...","lines":[...]}'>
          {
  "title": "Duchu Święty",
  "composer": "Szymon Czyżewski, Melania Król, Dawid Leszczyński",
  "author": "Szymon Czyżewski, Melania Król, Dawid Leszczyński",
  "lines": [
    {
      "lineType": "VERSE",
      "lyrics": "Nie ma nic ważniejszego, kiedy jesteś tu blisko",
      "tones": [
        { "chord": "D", "position": 0 },
        { "chord": "A", "position": 315 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Z Tobą nic się nie równa, jesteś żywą nadzieją",
      "tones": [
        { "chord": "D", "position": 315 }
      ]
    },
    {
      "lineType": "REFRAIN",
      "lyrics": "Obecność Twa",
      "tones": [
        { "chord": "A", "position": 80 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Spróbowałem i pragnę najsłodszej miłości",
      "tones": [
        { "chord": "D", "position": 0 },
        { "chord": "A", "position": 300 }
      ]
    },
    {
      "lineType": "VERSE",
      "lyrics": "Moje serce jest wolne od wstydu i hańby",
      "tones": [
        { "chord": "D", "position": 280 }
      ]
    },
    {
      "lineType": "REFRAIN",
      "lyrics": "Obecność Twa",
      "tones": [
        { "chord": "A", "position": 80 }
      ]
    },
    {
      "lineType": "CHORUS",
      "lyrics": "Duchu Święty, zapraszamy Cię",
      "tones": [
        { "chord": "D", "position": 0 }
      ]
    },
    {
      "lineType": "CHORUS",
      "lyrics": "Obecność Twa, jak fala, zmienia miejsce te",
      "tones": [
        { "chord": "A", "position": 15 }
      ]
    },
    {
      "lineType": "CHORUS",
      "lyrics": "Twoja chwała niech przenika serce me",
      "tones": [
        { "chord": "D", "position": 60 }
      ]
    },
    {
      "lineType": "CHORUS",
      "lyrics": "Przejmij, Panie, wszystko, obecności chcemy Twej",
      "tones": [
        { "chord": "A", "position": 80 },
        { "chord": "Em", "position": 120 },
        { "chord": "D", "position": 280 },
        { "chord": "A", "position": 300 }
      ]
    },
    {
      "lineType": "BRIDGE",
      "lyrics": "Spraw, byśmy byli bardziej świadomi Twej obecności",
      "tones": [
        { "chord": "D", "position": 0 }
      ]
    },
    {
      "lineType": "BRIDGE",
      "lyrics": "Daj nam doświadczyć dobroci Twojej chwały",
      "tones": [
        { "chord": "A", "position": 0 },
        { "chord": "Em", "position": 220 }
      ]
    }
  ]
}
        </textarea>
    </div>
    <div class="button-group">
      <button onclick="postJson()">CREATE PDF</button>
      <button onclick="previewJson()">PREVIEW PDF</button>
    </div>
  </div>
</div>

<script>
  function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.querySelector(`.tab[onclick*="${tabId}"]`).classList.add('active');
    document.getElementById(tabId).classList.add('active');
  }

  async function createPDF() {
    const songId = document.getElementById("songId").value;
    try {
      const response = await fetch(`http://localhost:8081/api/v1/pdfs/1/${songId}`);
      if (!response.ok) throw new Error("Failed to fetch PDF");
      const pdfDto = await response.json();
      downloadPdf(pdfDto);
    } catch (error) {
      alert("Error generating PDF: " + error.message);
    }
  }

  function previewPDF() {
    const songId = document.getElementById("songId").value;
    if (!songId) {
      alert("Please select a song first.");
      return;
    }
    const previewUrl = `http://localhost:8081/api/v1/pdfs/preview/1/${songId}`;
    window.open(previewUrl, "_blank");
  }

  async function postJson() {
    const jsonInput = document.getElementById("jsonInput").value;
    try {
      const payload = JSON.parse(jsonInput);
      const response = await fetch("http://localhost:8081/api/v1/pdfs/1", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error("Failed to fetch PDF");
      const pdfDto = await response.json();
      downloadPdf(pdfDto);
    } catch (error) {
      alert("Error generating PDF: " + error.message);
    }
  }

  async function previewJson() {
    const jsonInput = document.getElementById("jsonInput").value;
    try {
      const payload = JSON.parse(jsonInput);
      const response = await fetch("http://localhost:8081/api/v1/pdfs/preview/1", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error("Failed to preview PDF");
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      window.open(url, "_blank");
    } catch (error) {
      alert("Error previewing PDF: " + error.message);
    }
  }

  function downloadPdf(pdfDto) {
    if (!pdfDto.data || !pdfDto.title) throw new Error("Invalid PDF data received");
    const byteCharacters = atob(pdfDto.data);
    const byteNumbers = Array.from(byteCharacters, c => c.charCodeAt(0));
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: "application/pdf" });

    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${pdfDto.title}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
  }

  async function fetchTitles() {
    const songSelection = document.getElementById("songId");
    try {
      const response = await fetch("http://localhost:8080/api/v1/titles/1");
      if (!response.ok) throw new Error("Problem with finding titles");
      const titles = await response.json();
      if (!Array.isArray(titles) || titles.length === 0) throw new Error("List of songs is empty");

      titles.forEach(title => {
        const option = document.createElement("option");
        option.value = title.songId;
        option.textContent = title.songTitle;
        songSelection.appendChild(option);
      });
    } catch (error) {
      console.error("Error loading song titles:", error.message);
    }
  }

  window.onload = fetchTitles;
</script>
</body>
</html>
